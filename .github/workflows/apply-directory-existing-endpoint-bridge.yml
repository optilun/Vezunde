name: Apply directory existing endpoint bridge

on:
  push:
    branches:
      - fix/directory-import-existing-endpoint-bridge
    paths:
      - .github/workflows/apply-directory-existing-endpoint-bridge.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/directory-import-existing-endpoint-bridge
          fetch-depth: 0
      - name: Update router and function-count checks
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('scripts/verify-directory-function-router.mjs'),
              Path('scripts/verify-service-configuration-function-router.mjs'),
              Path('scripts/verify-provider-workspace-function-router.mjs'),
              Path('scripts/verify-patient-guidance-adaptive-question-selection.mjs'),
              Path('scripts/verify-patient-guidance-question-selection-hardening.mjs'),
              Path('scripts/verify-patient-guidance-runtime-shadow.mjs'),
          ]

          for path in files:
              text = path.read_text()
              text = text.replace(
                  "physicalEndpoints.length, 49, 'Suprafata Base44 trebuie sa contina exact 49 de functii fizice dupa separarea runtime-ului de import'",
                  "physicalEndpoints.length, 48, 'Suprafata Base44 trebuie sa contina exact 48 de functii fizice dupa folosirea bridge-ului existent'",
              )
              text = text.replace('physicalFunctions.length, 49', 'physicalFunctions.length, 48')
              text = text.replace("functionName: 'directoryImportRuntimeOps'", "functionName: 'listProviderMemberInvitations'")
              path.write_text(text)

          path = Path('scripts/verify-directory-function-router.mjs')
          text = path.read_text()
          old = """const dedicatedEntrySource = source('base44/functions/directoryImportRuntimeOps/entry.ts');
          assert.match(dedicatedEntrySource, /directoryImportOpsLatest\\.ts/);
          assert.match(dedicatedEntrySource, /logicalName !== 'directoryImportOps'/);
          assert.match(dedicatedEntrySource, /Deno\\.serve\\(/);
          """
          new = """const bridgeEntrySource = source('base44/functions/listProviderMemberInvitations/entry.ts');
          assert.match(bridgeEntrySource, /directoryImportOpsLatest\\.ts/);
          assert.match(bridgeEntrySource, /body\\?\\.__function === DIRECTORY_IMPORT_LOGICAL_NAME/);
          assert.match(bridgeEntrySource, /return handleInvitationList\\(req\\)/);
          """
          if old not in text:
              raise SystemExit('directory bridge assertion block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-directory-function-router.mjs scripts/verify-service-configuration-function-router.mjs scripts/verify-provider-workspace-function-router.mjs scripts/verify-patient-guidance-adaptive-question-selection.mjs scripts/verify-patient-guidance-question-selection-hardening.mjs scripts/verify-patient-guidance-runtime-shadow.mjs
          git diff --cached --check
          git commit -m "Verify directory import existing endpoint bridge [skip ci]"
          git push origin HEAD:fix/directory-import-existing-endpoint-bridge

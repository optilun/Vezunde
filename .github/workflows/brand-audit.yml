name: Brand casing audit

on:
  pull_request:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find ViaSee references
        run: |
          grep -RIn --exclude-dir=.git --exclude='package-lock.json' --exclude='*.map' 'ViaSee' . > grep-results.txt || true
          cat grep-results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: brand-audit-results
          path: grep-results.txt

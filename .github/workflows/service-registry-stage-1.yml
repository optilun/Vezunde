      - "shared/patientRequestDistributionLock.js"
      - "shared/locationScopedEntityQuery.js"
      - "shared/providerLeadEligibility.js"
      - "shared/providerLeadInboxPolicy.js"
      - "src/lib/canonicalServiceCatalog.js"
      - "src/lib/directoryOpsCatalog.js"
      - "src/lib/servicePresentation.js"
      - "src/lib/providerServiceWorkspaceSections.js"
      - "src/lib/providerSemanticSearch.js"

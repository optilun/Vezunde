      - ".github/workflows/service-registry-stage-1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify service registry and prerequisites
        id: service_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:services 2>&1 | tee test-services.log
      - name: Verify dead code cleanup
        id: dead_code_cleanup
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-dead-code-cleanup.mjs 2>&1 | tee dead-code-cleanup.log
      - name: Frontend dead code audit report
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/audit-frontend-dead-code.mjs 2>&1 | tee dead-code-audit.log
      - name: Typecheck service scope
        id: targeted_typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck:services 2>&1 | tee typecheck-services.log
      - name: Lint service scope
        id: targeted_lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint:services 2>&1 | tee lint-services.log
      - name: Repository typecheck diagnostic
        id: repository_typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
      - name: Repository lint diagnostic
        id: repository_lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log
      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-prerequisite-ci-logs
          path: |
            test-services.log
            dead-code-cleanup.log
            dead-code-audit.log
            typecheck-services.log
            lint-services.log
            typecheck.log
            lint.log
            build.log
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce stage verification result
        if: always()
        shell: bash
        run: |
          test "${{ steps.service_tests.outcome }}" = "success"
          test "${{ steps.dead_code_cleanup.outcome }}" = "success"
          test "${{ steps.targeted_typecheck.outcome }}" = "success"
          test "${{ steps.targeted_lint.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"

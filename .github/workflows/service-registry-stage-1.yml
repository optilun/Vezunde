      - "scripts/verify-service-legacy-flows.mjs"
      - "scripts/verify-service-prerequisites.mjs"
      - "scripts/verify-patient-need-interpretation.mjs"
      - "scripts/verify-patient-ai-intent-confirmation.mjs"
      - "scripts/verify-patient-request-review-contract.mjs"
      - "scripts/verify-patient-request-persistence.mjs"
      - "scripts/verify-provider-lead-preparation.mjs"
      - "scripts/verify-provider-lead-inbox-free.mjs"
      - "scripts/verify-location-scoped-query.mjs"
      - "scripts/verify-patient-search-flow.mjs"

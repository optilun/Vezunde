name: Apply location no-op client guard

on:
  push:
    branches:
      - fix/location-noop-client-guard
    paths:
      - scripts/apply-location-noop-client-guard.py
      - .github/workflows/apply-location-noop-client-guard.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/location-noop-client-guard
          fetch-depth: 0

      - name: Apply targeted changes
        run: python scripts/apply-location-noop-client-guard.py

      - name: Install dependencies
        run: npm ci

      - name: Run provider submission checks
        run: npm run test:provider-submissions

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prevent unchanged location submissions in provider UI"
          git push origin HEAD:fix/location-noop-client-guard

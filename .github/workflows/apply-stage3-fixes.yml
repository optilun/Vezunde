name: Apply Stage 3 Source Cleanup

on:
  push:
    branches:
      - chatgpt/services-workspace-stage-3
    paths:
      - "scripts/apply-stage3-fixes.mjs"
      - ".github/workflows/apply-stage3-fixes.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/services-workspace-stage-3
          fetch-depth: 0
      - name: Apply cleanup
        run: node scripts/apply-stage3-fixes.mjs
      - name: Commit cleaned source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/workspace/provider/ProviderServicesWorkspace.jsx
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Remove unused Stage 3 workspace import"
          git push origin HEAD:chatgpt/services-workspace-stage-3

name: Apply provider status center patch

on:
  pull_request:
    paths:
      - ".github/workflows/apply-provider-status-center-temp.yml"
      - ".github/patches/provider-status-center.v2.part-00"
      - ".github/patches/provider-status-center.v2.part-00b"
      - ".github/patches/provider-status-center.v2.ready"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply implementation
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/patches/provider-status-center.v2.ready
          PARTS=(
            .github/patches/provider-status-center.v2.part-00
            .github/patches/provider-status-center.v2.part-00b
            .github/patches/provider-status-center.patch.b64.part-01
            .github/patches/provider-status-center.patch.b64.part-02
            .github/patches/provider-status-center.patch.b64.part-03
            .github/patches/provider-status-center.patch.b64.part-04
            .github/patches/provider-status-center.patch.b64.part-05
            .github/patches/provider-status-center.patch.b64.part-06
            .github/patches/provider-status-center.patch.b64.part-07
            .github/patches/provider-status-center.patch.b64.part-08
          )
          cat "${PARTS[@]}" > /tmp/provider-status-center.patch.b64
          test "$(wc -c < /tmp/provider-status-center.patch.b64)" -eq 64244
          base64 --decode /tmp/provider-status-center.patch.b64 > /tmp/provider-status-center.patch
          test "$(wc -c < /tmp/provider-status-center.patch)" -eq 48183
          git apply --check --verbose /tmp/provider-status-center.patch
          git apply /tmp/provider-status-center.patch
          rm -f .github/patches/provider-status-center.patch.b64.part-* .github/patches/provider-status-center.patch.ready
          rm -f .github/patches/provider-status-center.v2.part-* .github/patches/provider-status-center.v2.ready .github/workflows/apply-provider-status-center-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add provider status center and canonical completeness"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

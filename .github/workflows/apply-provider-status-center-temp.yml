name: Apply provider status center patch

on:
  pull_request:
    paths:
      - ".github/workflows/apply-provider-status-center-temp.yml"
      - ".github/patches/provider-status-center.patch.b64.part-*"
      - ".github/patches/provider-status-center.patch.ready"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply implementation
        id: apply_patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          shopt -s nullglob
          PARTS=(.github/patches/provider-status-center.patch.b64.part-*)
          test -f .github/patches/provider-status-center.patch.ready
          test "${#PARTS[@]}" -gt 0
          {
            echo "part_count=${#PARTS[@]}"
            wc -c "${PARTS[@]}"
            cat "${PARTS[@]}" > /tmp/provider-status-center.patch.b64
            wc -c /tmp/provider-status-center.patch.b64
            sha256sum /tmp/provider-status-center.patch.b64
            base64 --decode /tmp/provider-status-center.patch.b64 > /tmp/provider-status-center.patch
            wc -c /tmp/provider-status-center.patch
            sha256sum /tmp/provider-status-center.patch
            git apply --check --verbose /tmp/provider-status-center.patch
            git apply /tmp/provider-status-center.patch
          } 2>&1 | tee /tmp/provider-status-center-apply.log
          rm -f "${PARTS[@]}" .github/patches/provider-status-center.patch.ready .github/workflows/apply-provider-status-center-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add provider status center and canonical completeness"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-status-center-patch-diagnostics
          path: |
            /tmp/provider-status-center-apply.log
            /tmp/provider-status-center.patch
            /tmp/provider-status-center.patch.b64
          retention-days: 1
      - name: Enforce patch application
        if: always()
        run: test "${{ steps.apply_patch.outcome }}" = "success"

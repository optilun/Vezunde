name: Base44 Provider Workspace Router

on:
  pull_request:
    paths:
      - "base44/functions/getMyProviderWorkspace/**"
      - "base44/shared/providerWorkspaceFunctionRouting.js"
      - "base44/shared/directoryFunctionRouting.js"
      - "base44/shared/serviceConfigurationFunctionRouting.js"
      - "src/api/base44Client.js"
      - "src/api/base44FunctionRouting.js"
      - "scripts/verify-provider-workspace-function-router.mjs"
      - "scripts/verify-directory-function-router.mjs"
      - "scripts/verify-service-configuration-function-router.mjs"
      - "scripts/verify-provider-account-workflow-e2e.mjs"
      - "scripts/verify-provider-logo-review-status.mjs"
      - "scripts/verify-provider-onboarding-continuity.mjs"
      - "scripts/verify-provider-entitlement.mjs"
      - "scripts/verify-provider-profile-completeness.mjs"
      - "scripts/verify-provider-organization-admin-access.mjs"
      - "scripts/verify-provider-location-access-scope.mjs"
      - "scripts/verify-account-workspace-loading.mjs"
      - "scripts/compare-typecheck-baseline.mjs"
      - "package.json"
      - ".github/workflows/base44-provider-workspace-router-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --silent
      - name: Parse router sources
        run: |
          node --check base44/shared/providerWorkspaceFunctionRouting.js
          node --check src/api/base44FunctionRouting.js
          node --check scripts/verify-provider-workspace-function-router.mjs
          find base44/functions/getMyProviderWorkspace -name '*.ts' -print0 | xargs -0 -n1 node --check
      - name: Verify physical surface and provider workspace routes
        run: npm run test:provider-workspace-router
      - name: Verify directory and service configuration routes
        run: |
          npm run test:directory-router
          npm run test:service-configuration-router
      - name: Verify provider account loading and onboarding continuity
        run: |
          npm run test:account-loading
          node scripts/verify-provider-onboarding-continuity.mjs
      - name: Verify provider workspace read contracts
        run: |
          node scripts/verify-provider-entitlement.mjs
          node scripts/verify-provider-profile-completeness.mjs
          npm run test:provider-logo-review
          npm run test:provider-account-e2e
      - name: Verify owner manager staff matrix and location isolation
        run: |
          npm run test:provider-organization-admin
          npm run test:provider-location-access
      - name: Typecheck services
        run: npm run typecheck:services
      - name: Capture current typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck -- --pretty false > typecheck-head.log 2>&1
          grep -E "error TS|Found [0-9]+ errors" typecheck-head.log || true
          exit 0
      - name: Capture current main typecheck
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          git fetch origin "$BASE_SHA" --depth=1
          rm -rf /tmp/vezunde-provider-workspace-router-base
          git worktree add --detach /tmp/vezunde-provider-workspace-router-base "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/vezunde-provider-workspace-router-base/node_modules
          cd /tmp/vezunde-provider-workspace-router-base
          ./node_modules/.bin/tsc -p ./jsconfig.json --pretty false > "$GITHUB_WORKSPACE/typecheck-base.log" 2>&1
          exit 0
      - name: Reject TypeScript regressions against current main
        if: github.event_name == 'pull_request'
        run: node scripts/compare-typecheck-baseline.mjs typecheck-base.log typecheck-head.log
      - name: Services lint
        run: npm run lint:services
      - name: Repository lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base44-provider-workspace-router-typecheck
          path: |
            typecheck-head.log
            typecheck-base.log


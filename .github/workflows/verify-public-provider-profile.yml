name: Verify public provider profile

on:
  pull_request:
    branches:
      - main
    paths:
      - src/pages/ProviderProfile.jsx
      - src/components/provider/ProviderLocationHero.jsx
      - src/components/results/TrustBadge.jsx
      - base44/functions/getPublicProviderProfile/entry.ts
      - .github/workflows/verify-public-provider-profile.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

name: Patient Conversation Self-Hosted Validation

on:
  pull_request:
    paths:
      - "shared/**"
      - "base44/shared/**"
      - "base44/functions/matchProvidersSemantic/**"
      - "src/lib/patient*.js"
      - "src/lib/providerSemanticSearch.js"
      - "src/components/intake2/**"
      - "scripts/verify-patient-conversation-*.mjs"
      - "scripts/verify-patient-guidance-*.mjs"
      - "scripts/patient-conversation-*.mjs"
      - "scripts/prepare-patient-conversation-*.mjs"
      - "scripts/evaluate-patient-conversation-*.mjs"
      - "tests/fixtures/patient-conversation-*.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/patient-conversation-self-hosted-validation-ci.yml"

concurrency:
  group: patient-conversation-self-hosted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        shell: cmd
        run: npm ci --no-audit --no-fund
      - name: Verify service and patient-conversation suites
        shell: cmd
        run: |
          call npm run test:services > test-services.log 2>&1
          set TEST_EXIT=%ERRORLEVEL%
          if not "%TEST_EXIT%"=="0" node -e "const fs=require('fs');const rows=fs.readFileSync('test-services.log','utf8').split(/\r?\n/);console.log(rows.slice(-60).join('\n'))"
          exit /b %TEST_EXIT%
      - name: Upload service failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: patient-conversation-test-services-log
          path: test-services.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Typecheck service scope
        shell: cmd
        run: npm run typecheck:services
      - name: Build application
        shell: cmd
        run: npm run build
      - name: Lint repository
        shell: cmd
        run: npm run lint

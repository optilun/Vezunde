name: PR266 Merge Main

on:
  push:
    branches:
      - feat/patient-conversation-agent-contract
    paths:
      - ".github/workflows/patient-conversation-self-hosted-validation-ci.yml"

permissions:
  contents: write

concurrency:
  group: pr266-merge-main-once
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/patient-conversation-agent-contract
          fetch-depth: 0
          persist-credentials: true
      - name: Merge main or record conflicts
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff -X ours origin/main -m "Merge main after PR 265"
          if errorlevel 1 goto conflict
          git merge-base --is-ancestor origin/main HEAD
          if errorlevel 1 exit /b 1
          git push origin HEAD:refs/heads/feat/patient-conversation-agent-contract
          exit /b %ERRORLEVEL%
          :conflict
          git diff --name-only --diff-filter=U > "%RUNNER_TEMP%\pr266-merge-conflicts.txt"
          git merge --abort
          copy /Y "%RUNNER_TEMP%\pr266-merge-conflicts.txt" pr266-merge-conflicts.txt
          git add pr266-merge-conflicts.txt
          git commit -m "Record PR266 merge conflicts"
          git push origin HEAD:refs/heads/feat/patient-conversation-agent-contract
          exit /b %ERRORLEVEL%

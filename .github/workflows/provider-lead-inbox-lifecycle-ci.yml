name: Provider Lead Inbox Lifecycle

on:
  pull_request:
    paths:
      - "shared/providerLeadInboxPolicy.js"
      - "shared/providerLeadFullDetailsPolicy.js"
      - "shared/patientRequestLifecycleOps.js"
      - "base44/functions/providerLeadInboxOps/entry.ts"
      - "base44/functions/providerLeadResponseOps/entry.ts"
      - "base44/functions/controlledChatOps/entry.ts"
      - "src/components/workspace/provider/ProviderLeadInbox.jsx"
      - "src/components/workspace/provider/ProviderLeadChat.jsx"
      - "src/components/workspace/provider/ProviderLeadContactAccess.jsx"
      - "src/components/notifications/ProviderNotificationCenter.jsx"
      - "scripts/verify-provider-lead-inbox-free.mjs"
      - ".github/workflows/provider-lead-inbox-lifecycle-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify provider inbox lifecycle
        run: node scripts/verify-provider-lead-inbox-free.mjs
      - name: Verify existing service regressions
        run: npm run test:services
      - name: Typecheck service scope
        run: npm run typecheck:services
      - name: Lint provider inbox lifecycle scope
        run: >-
          npx eslint
          shared/providerLeadInboxPolicy.js
          base44/functions/providerLeadInboxOps/entry.ts
          src/components/workspace/provider/ProviderLeadInbox.jsx
          src/components/workspace/provider/ProviderLeadChat.jsx
          src/components/notifications/ProviderNotificationCenter.jsx
          scripts/verify-provider-lead-inbox-free.mjs
          --quiet
      - name: Repository typecheck diagnostic
        continue-on-error: true
        run: npm run typecheck
      - name: Repository lint
        run: npm run lint
      - name: Build
        run: npm run build

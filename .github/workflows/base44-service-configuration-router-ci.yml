name: Base44 Service Configuration Router

on:
  pull_request:
    paths:
      - "base44/functions/providerServiceConfigurationOps/**"
      - "base44/shared/serviceConfigurationFunctionRouting.js"
      - "src/api/base44Client.js"
      - "src/api/base44FunctionRouting.js"
      - "scripts/verify-service-configuration-function-router.mjs"
      - "scripts/verify-directory-function-router.mjs"
      - "scripts/verify-service-registry.mjs"
      - "scripts/verify-service-prerequisites.mjs"
      - "scripts/verify-provider-service-copy.mjs"
      - "scripts/verify-provider-opening-hours.mjs"
      - "scripts/verify-provider-submission-backend.mjs"
      - "scripts/verify-provider-account-workflow-e2e.mjs"
      - "scripts/verify-provider-logo-review-status.mjs"
      - "scripts/compare-typecheck-baseline.mjs"
      - "package.json"
      - ".github/workflows/base44-service-configuration-router-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --silent
      - name: Parse router sources
        run: |
          node --check base44/shared/serviceConfigurationFunctionRouting.js
          node --check src/api/base44FunctionRouting.js
          node --check scripts/verify-service-configuration-function-router.mjs
          find base44/functions/providerServiceConfigurationOps -name '*.ts' -print0 | xargs -0 -n1 node --check
      - name: Verify physical surface and service configuration routes
        run: npm run test:service-configuration-router
      - name: Verify directory routes remain valid
        run: npm run test:directory-router
      - name: Verify provider service configuration and prerequisites
        run: npm run test:services
      - name: Verify service copy
        run: node scripts/verify-provider-service-copy.mjs
      - name: Verify opening hours
        run: npm run test:provider-hours
      - name: Verify workspace submissions and organization profile
        run: npm run test:provider-submissions
      - name: Verify provider account and photographs
        run: npm run test:provider-account-e2e
      - name: Verify logo review
        run: npm run test:provider-logo-review
      - name: Verify owner manager staff matrix
        run: |
          npm run test:provider-organization-admin
          npm run test:provider-location-access
      - name: Typecheck services
        run: npm run typecheck:services
      - name: Capture current typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck -- --pretty false > typecheck-head.log 2>&1
          grep -E "error TS|Found [0-9]+ errors" typecheck-head.log || true
          exit 0
      - name: Capture current main typecheck
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          git fetch origin "$BASE_SHA" --depth=1
          rm -rf /tmp/vezunde-service-router-base
          git worktree add --detach /tmp/vezunde-service-router-base "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/vezunde-service-router-base/node_modules
          cd /tmp/vezunde-service-router-base
          ./node_modules/.bin/tsc -p ./jsconfig.json --pretty false > "$GITHUB_WORKSPACE/typecheck-base.log" 2>&1
          exit 0
      - name: Reject TypeScript regressions against current main
        if: github.event_name == 'pull_request'
        run: node scripts/compare-typecheck-baseline.mjs typecheck-base.log typecheck-head.log
      - name: Services lint
        run: npm run lint:services
      - name: Repository lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base44-service-configuration-router-typecheck
          path: |
            typecheck-head.log
            typecheck-base.log

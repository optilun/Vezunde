name: Apply directory runtime explicit types

on:
  push:
    branches:
      - fix/directory-runtime-explicit-canonical-types
    paths:
      - .github/workflows/apply-directory-runtime-explicit-types.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/directory-runtime-explicit-canonical-types
          fetch-depth: 0

      - name: Apply exact runtime changes
        run: |
          python - <<'PY'
          from pathlib import Path

          backend_path = Path('base44/functions/directoryOps/directoryImportOps.ts')
          backend = backend_path.read_text()

          anchor = """const ORGANIZATION_TYPES = new Set([
            'independent_optical_store',
            'optical_chain',
            'ophthalmology_clinic',
            'ophthalmology_office',
            'independent_ophthalmologist',
            'independent_optometrist',
            'independent_optician',
            'optical_laboratory_b2c',
            'optical_laboratory_b2b',
            'future_b2b_distributor',
          ]);
          """
          addition = anchor + """

          const LOCATION_FIRST_CLASSIFICATION_CONTRACT_VERSION = 'viasee-directory-location-first-v1';
          const RUNTIME_PROVIDER_TYPES = new Set([
            'optica_medicala',
            'clinica_oftalmologica',
            'cabinet_oftalmologic',
            'cabinet_optometric',
            'laborator_optic',
            'optometrist_independent',
            'medic_oftalmolog_independent',
          ]);
          const RUNTIME_PROVIDER_PROFILE_TYPES = new Set([
            'independent_optical_store',
            'optical_chain',
            'ophthalmology_clinic',
            'ophthalmology_office',
            'independent_ophthalmologist',
            'independent_optometrist',
            'independent_optician',
            'optical_laboratory_b2c',
            'optical_laboratory_b2b',
            'future_b2b_distributor',
          ]);
          const RUNTIME_ORGANIZATION_TYPE_CODES = new Set([
            'independent_optical_store',
            'optical_chain',
            'ophthalmology_clinic',
            'ophthalmology_office',
            'healthcare_network',
            'multi_specialty_healthcare_provider',
            'public_healthcare_institution',
            'independent_professional',
            'optical_laboratory',
            'b2b_distributor',
            'other',
          ]);
          const RUNTIME_LOCATION_TYPE_CODES = new Set([
            'optical_store',
            'optometry_office',
            'ophthalmology_office',
            'ophthalmology_clinic',
            'multi_specialty_clinic',
            'hospital_department',
            'hospital_outpatient_unit',
            'optical_laboratory',
            'independent_professional_office',
            'other',
          ]);
          const RUNTIME_CARE_SETTING_CODES = new Set([
            'retail',
            'outpatient',
            'hospital_outpatient',
            'hospital_inpatient',
            'mixed',
            'laboratory',
            'other',
          ]);
          """
          if anchor not in backend:
              raise SystemExit('organization type constants anchor not found')
          backend = backend.replace(anchor, addition, 1)

          function_anchor = """function organizationTypeFor(row) {
            const profileType = clean(row.provider_profile_type, 120);
            if (ORGANIZATION_TYPES.has(profileType)) return profileType;
            if (profileType === 'independent_optometrist') return 'independent_optometrist';
            if (profileType === 'ophthalmology_office') return 'ophthalmology_office';
            if (profileType === 'ophthalmology_clinic') return 'ophthalmology_clinic';
            if (profileType === 'optical_laboratory_b2c') return 'optical_laboratory_b2c';
            return 'independent_optical_store';
          }
          """
          function_addition = function_anchor + """

          function organizationTypeCodeFor(row) {
            const explicitType = clean(row.organization_type_code, 120);
            if (RUNTIME_ORGANIZATION_TYPE_CODES.has(explicitType)) return explicitType;
            return organizationTypeFor(row);
          }

          function normalizeDirectoryImportRowRuntime(raw, context) {
            const normalized = normalizeDirectoryImportRow(raw, context);
            const explicitLocationType = {
              provider_type: clean(raw?.provider_type, 120),
              provider_profile_type: clean(raw?.provider_profile_type, 120),
              location_type_code: clean(raw?.location_type_code, 120),
              care_setting_code: clean(raw?.care_setting_code, 120),
            };
            const hasExplicitLocationType = Object.values(explicitLocationType).some(Boolean);
            if (hasExplicitLocationType) {
              const valid = RUNTIME_PROVIDER_TYPES.has(explicitLocationType.provider_type)
                && RUNTIME_PROVIDER_PROFILE_TYPES.has(explicitLocationType.provider_profile_type)
                && RUNTIME_LOCATION_TYPE_CODES.has(explicitLocationType.location_type_code)
                && RUNTIME_CARE_SETTING_CODES.has(explicitLocationType.care_setting_code);
              normalized.provider_type = valid ? explicitLocationType.provider_type : '';
              normalized.provider_profile_type = valid ? explicitLocationType.provider_profile_type : '';
              normalized.location_type_code = valid ? explicitLocationType.location_type_code : '';
              normalized.care_setting_code = valid ? explicitLocationType.care_setting_code : '';
              normalized.canonical_type_source = 'source_explicit';
              normalized.canonical_type_invalid = !valid;
            }

            const explicitOrganizationType = clean(raw?.organization_type_code || raw?.organization_type, 120);
            if (explicitOrganizationType) {
              const valid = RUNTIME_ORGANIZATION_TYPE_CODES.has(explicitOrganizationType);
              normalized.organization_type_code = valid ? explicitOrganizationType : '';
              normalized.organization_type_source = 'source_explicit';
              normalized.organization_type_invalid = !valid;
              normalized.organization_type_legacy_fallback = false;
            } else if (
              !normalized.organization_type_code
              && normalized.provider_profile_type
              && RUNTIME_ORGANIZATION_TYPE_CODES.has(normalized.provider_profile_type)
            ) {
              normalized.organization_type_code = normalized.provider_profile_type;
              normalized.organization_type_source = 'legacy_profile_fallback';
              normalized.organization_type_invalid = false;
              normalized.organization_type_legacy_fallback = true;
            }

            normalized.classification_contract_version = LOCATION_FIRST_CLASSIFICATION_CONTRACT_VERSION;
            return normalized;
          }
          """
          if function_anchor not in backend:
              raise SystemExit('organizationTypeFor block not found')
          backend = backend.replace(function_anchor, function_addition, 1)

          old_normalize = """    const normalized = normalizeDirectoryImportRow(raw, {
          """
          new_normalize = """    const normalized = normalizeDirectoryImportRowRuntime(raw, {
          """
          if old_normalize not in backend:
              raise SystemExit('snapshot normalization call not found')
          backend = backend.replace(old_normalize, new_normalize, 1)

          old_required = """    } else if (!normalized.provider_type || !normalized.provider_profile_type || !normalized.location_type_code || !normalized.care_setting_code) {
              plannedAction = 'block_conflict';
              validation.errors.push('canonical_type_not_resolved');
              validation.validation_codes.push('canonical_type_not_resolved');
          """
          new_required = """    } else if (
              !normalized.provider_type
              || !normalized.provider_profile_type
              || !normalized.location_type_code
              || !normalized.care_setting_code
              || (normalized.organization_name && !normalized.organization_type_code)
            ) {
              plannedAction = 'block_conflict';
              const code = normalized.organization_name && !normalized.organization_type_code
                ? 'organization_type_not_resolved'
                : 'canonical_type_not_resolved';
              validation.errors.push(code);
              validation.validation_codes.push(code);
          """
          if old_required not in backend:
              raise SystemExit('canonical requirement block not found')
          backend = backend.replace(old_required, new_required, 1)

          old_allowed = """    'provider_type', 'provider_profile_type', 'location_type_code', 'care_setting_code',
          """
          new_allowed = """    'provider_type', 'provider_profile_type', 'organization_type_code', 'location_type_code', 'care_setting_code',
          """
          if old_allowed not in backend:
              raise SystemExit('override allowed keys block not found')
          backend = backend.replace(old_allowed, new_allowed, 1)

          old_org_value = """    organization_type_code: row.provider_profile_type === 'optical_chain' ? 'optical_chain' : organizationTypeFor(row),
          """
          new_org_value = """    organization_type_code: organizationTypeCodeFor(row),
          """
          if old_org_value not in backend:
              raise SystemExit('organization type code value not found')
          backend = backend.replace(old_org_value, new_org_value, 1)

          backend_path.write_text(backend)

          entry_path = Path('base44/functions/directoryOps/entry.ts')
          entry = entry_path.read_text()
          old_revision = "viasee-runtime-resync-2026-07-28-directory-location-first-1"
          new_revision = "viasee-runtime-resync-2026-07-28-directory-explicit-types-2"
          if old_revision not in entry:
              raise SystemExit('directoryOps revision not found')
          entry_path.write_text(entry.replace(old_revision, new_revision, 1))

          test_path = Path('scripts/verify-directory-import-pipeline.mjs')
          test = test_path.read_text()
          test_anchor = """assert.match(backend, /CONTROLLED_PROFILES/);
          """
          test_addition = """assert.match(backend, /CONTROLLED_PROFILES/);
          assert.match(backend, /function normalizeDirectoryImportRowRuntime\(raw, context\)/);
          assert.match(backend, /normalized\.classification_contract_version = LOCATION_FIRST_CLASSIFICATION_CONTRACT_VERSION/);
          assert.match(backend, /normalized\.canonical_type_source = 'source_explicit'/);
          assert.match(backend, /organization_type_code: organizationTypeCodeFor\(row\)/);
          assert.match(backend, /organization_name && !normalized\.organization_type_code/);
          assert.match(backend, /'organization_type_code', 'location_type_code'/);
          """
          if test_anchor not in test:
              raise SystemExit('backend assertion anchor not found')
          test_path.write_text(test.replace(test_anchor, test_addition, 1))
          PY

      - name: Commit runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add base44/functions/directoryOps/directoryImportOps.ts base44/functions/directoryOps/entry.ts scripts/verify-directory-import-pipeline.mjs
          git diff --cached --check
          git commit -m "Preserve explicit canonical types in directory runtime [skip ci]"
          git push origin HEAD:fix/directory-runtime-explicit-canonical-types

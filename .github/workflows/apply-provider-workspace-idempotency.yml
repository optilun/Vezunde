name: Apply provider workspace idempotency fix

on:
  push:
    branches:
      - fix/provider-workspace-idempotency
    paths:
      - scripts/apply-provider-workspace-idempotency.py
      - .github/workflows/apply-provider-workspace-idempotency.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-provider-workspace-idempotency.py
      - .github/workflows/apply-provider-workspace-idempotency.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provider-workspace-idempotency
          fetch-depth: 0

      - name: Apply targeted changes
        run: python scripts/apply-provider-workspace-idempotency.py

      - name: Install dependencies
        run: npm ci

      - name: Run provider submission checks
        run: npm run test:provider-submissions | tee provider-tests.log

      - name: Run lint
        continue-on-error: true
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log

      - name: Build
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-idempotency-verification
          path: |
            provider-tests.log
            lint.log
            build.log

      - name: Require lint and build success
        run: |
          npm run lint
          npm run build

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden provider workspace submission idempotency"
          git push origin HEAD:fix/provider-workspace-idempotency

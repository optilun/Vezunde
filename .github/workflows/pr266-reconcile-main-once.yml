name: PR266 Reconcile Main Once

on:
  pull_request:
    paths:
      - ".github/workflows/pr266-reconcile-main-once.yml"

permissions:
  contents: write

concurrency:
  group: pr266-reconcile-main-once
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/patient-conversation-agent-contract
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Merge current main locally
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff -X ours origin/main -m "Merge main after PR 265"
          git merge-base --is-ancestor origin/main HEAD
      - name: Install dependencies
        shell: cmd
        run: npm ci --no-audit --no-fund
      - name: Verify service and patient-conversation suites
        shell: cmd
        run: |
          call npm run test:services > test-services.log 2>&1
          set TEST_EXIT=%ERRORLEVEL%
          if not "%TEST_EXIT%"=="0" node -e "const fs=require('fs');const rows=fs.readFileSync('test-services.log','utf8').split(/\r?\n/);console.log(rows.slice(-100).join('\n'))"
          exit /b %TEST_EXIT%
      - name: Verify post-evaluation stabilization
        shell: cmd
        run: node scripts/verify-patient-conversation-post-evaluation.mjs
      - name: Typecheck service scope
        shell: cmd
        run: npm run typecheck:services
      - name: Capture candidate full typecheck
        shell: cmd
        run: |
          call npm run typecheck -- --pretty false > typecheck-full.log 2>&1
          echo %ERRORLEVEL% > typecheck-full.exit
          exit /b 0
      - name: Capture main full typecheck baseline
        shell: cmd
        run: |
          git worktree prune
          if exist "%RUNNER_TEMP%\vezunde-pr266-main" rmdir /s /q "%RUNNER_TEMP%\vezunde-pr266-main"
          git worktree add --detach "%RUNNER_TEMP%\vezunde-pr266-main" origin/main
          pushd "%RUNNER_TEMP%\vezunde-pr266-main"
          call npm ci --no-audit --no-fund
          if errorlevel 1 exit /b %ERRORLEVEL%
          call npm run typecheck -- --pretty false > "%GITHUB_WORKSPACE%\typecheck-main.log" 2>&1
          echo %ERRORLEVEL% > "%GITHUB_WORKSPACE%\typecheck-main.exit"
          popd
          exit /b 0
      - name: Verify full typecheck baseline delta
        shell: cmd
        run: >-
          node scripts/verify-typecheck-baseline-delta.mjs
          typecheck-full.log
          typecheck-main.log
          typecheck-full.exit
          typecheck-main.exit
      - name: Remove main typecheck worktree
        if: always()
        shell: cmd
        run: |
          if exist "%RUNNER_TEMP%\vezunde-pr266-main" git worktree remove --force "%RUNNER_TEMP%\vezunde-pr266-main"
          git worktree prune
          exit /b 0
      - name: Build application
        shell: cmd
        run: npm run build
      - name: Lint repository
        shell: cmd
        run: npm run lint
      - name: Push validated merge
        shell: cmd
        run: git push origin HEAD:refs/heads/feat/patient-conversation-agent-contract
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr266-reconcile-main-evidence
          path: |
            test-services.log
            typecheck-full.log
            typecheck-main.log
            typecheck-full.exit
            typecheck-main.exit
          if-no-files-found: ignore
          retention-days: 3

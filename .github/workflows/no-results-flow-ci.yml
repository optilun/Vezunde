name: No Results Flow

on:
  pull_request:
    paths:
      - "src/components/intake2/NoResultsFlow.jsx"
      - "src/components/intake2/MatchResults.jsx"
      - "src/components/intake2/ConversationalCard.jsx"
      - "base44/functions/matchProvidersSemantic/coverage.js"
      - "scripts/verify-no-results-flow.mjs"
      - "scripts/verify-patient-search-flow.mjs"
      - ".github/workflows/no-results-flow-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify no-results flow
        run: node scripts/verify-no-results-flow.mjs
      - name: Verify patient search regressions
        run: node scripts/verify-patient-search-flow.mjs
      - name: Verify existing service regressions
        run: npm run test:services
      - name: Typecheck service scope
        run: npm run typecheck:services
      - name: Lint no-results scope
        run: >-
          npx eslint
          src/components/intake2/NoResultsFlow.jsx
          src/components/intake2/MatchResults.jsx
          scripts/verify-no-results-flow.mjs
          --quiet
      - name: Repository typecheck diagnostic
        continue-on-error: true
        run: npm run typecheck
      - name: Repository lint
        run: npm run lint
      - name: Build
        run: npm run build

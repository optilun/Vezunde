name: PR266 Finalize Automatic Runtime

on:
  pull_request:
    paths:
      - scripts/apply-pr266-post-evaluation-patch.mjs
      - .github/workflows/pr266-post-evaluation-patch-pr.yml

concurrency:
  group: pr266-finalize-automatic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-validate-clean:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/patient-conversation-agent-contract
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: cmd
        run: npm ci --no-audit --no-fund

      - name: Apply direct PR266 fixes
        shell: cmd
        run: node scripts/apply-pr266-post-evaluation-patch.mjs

      - name: Verify Automatic runtime boundary
        shell: cmd
        run: node scripts/verify-patient-conversation-shadow-route.mjs

      - name: Verify post-evaluation fixes
        shell: cmd
        run: node scripts/verify-patient-conversation-post-evaluation.mjs

      - name: Verify evaluator and response contract
        shell: cmd
        run: node scripts/verify-patient-conversation-evaluation.mjs && node scripts/verify-patient-conversation-model-response-contract.mjs

      - name: Verify failure and decision policies
        shell: cmd
        run: node scripts/verify-patient-conversation-terminal-failure-gate.mjs && node scripts/verify-patient-conversation-decision-policy.mjs && node scripts/verify-patient-conversation-operational-policy.mjs

      - name: Typecheck services
        shell: cmd
        run: npm run typecheck:services

      - name: Build application
        shell: cmd
        run: npm run build

      - name: Lint repository
        shell: cmd
        run: npm run lint

      - name: Remove temporary patch machinery
        shell: powershell
        run: |
          git rm --ignore-unmatch `
            .github/workflows/pr266-patch-probe.yml `
            .github/workflows/pr266-post-evaluation-patch.yml `
            .github/workflows/pr266-post-evaluation-patch-pr.yml `
            scripts/apply-pr266-post-evaluation-patch.mjs `
            scripts/repair-pr266-post-evaluation-applicator.mjs

      - name: Commit validated implementation
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No implementation changes to commit."
            exit 0
          }
          git commit -m "Finalize Automatic patient conversation runtime"
          git push origin "HEAD:feat/patient-conversation-agent-contract"

name: Apply professional lifecycle concurrency patch

on:
  push:
    branches:
      - fix/professional-lifecycle-concurrency
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/professional-lifecycle-concurrency
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply concurrency patch
        run: node scripts/apply-professional-lifecycle-concurrency-patch.mjs
      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            base44/entities/User.jsonc \
            base44/functions/professionalInvitationOps/entry.ts \
            base44/functions/manageMyProfessionalProfile/entry.ts \
            shared/professionalLifecycleLock.js \
            scripts/verify-professional-lifecycle-concurrency.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Serialize professional lifecycle writes"
          git push origin HEAD:fix/professional-lifecycle-concurrency

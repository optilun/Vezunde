name: Submit sitemap to IndexNow

on:
  push:
    branches:
      - main
    paths:
      - "public/sitemap.xml"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Submit sitemap URLs
        env:
          INDEXNOW_KEY: 7cde7bda0c3949b28bea2abaf2d32b42
          INDEXNOW_KEY_LOCATION: https://viasee.ro/7cde7bda0c3949b28bea2abaf2d32b42.txt
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const sitemap = fs.readFileSync('public/sitemap.xml', 'utf8');
          const urls = [...sitemap.matchAll(/<loc>([^<]+)<\/loc>/g)].map((match) => match[1].trim());

          if (urls.length === 0) {
            throw new Error('No URLs found in public/sitemap.xml');
          }

          const payload = {
            host: 'viasee.ro',
            key: process.env.INDEXNOW_KEY,
            keyLocation: process.env.INDEXNOW_KEY_LOCATION,
            urlList: urls,
          };

          const response = await fetch('https://api.indexnow.org/indexnow', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json; charset=utf-8' },
            body: JSON.stringify(payload),
          });

          const responseBody = await response.text();
          console.log(`Submitted ${urls.length} URLs. HTTP ${response.status}`);
          if (responseBody) console.log(responseBody);

          if (![200, 202].includes(response.status)) {
            throw new Error(`IndexNow rejected the submission with HTTP ${response.status}`);
          }
          NODE

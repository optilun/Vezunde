name: Patient Conversation Model Failure Diagnostics

on:
  pull_request:
    paths:
      - "base44/functions/matchProvidersSemantic/patientConversationModelFailureDiagnostics.js"
      - "base44/functions/matchProvidersSemantic/patientConversationAgentShadow.ts"
      - "scripts/verify-patient-conversation-model-failure-diagnostics.mjs"
      - ".github/workflows/patient-conversation-model-failure-diagnostics-ci.yml"

concurrency:
  group: patient-conversation-model-failure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify safe model failure diagnostics
        shell: cmd
        run: node scripts/verify-patient-conversation-model-failure-diagnostics.mjs
      - name: Verify shadow route contract
        shell: cmd
        run: node scripts/verify-patient-conversation-shadow-route.mjs

name: Regenerate location sitemap

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap-locations
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Lista vine din functia publica browseDirectoryProviders (map_scope: sitemap):
      # aceleasi profiluri pe care site-ul le arata oricui. Nu e nevoie de nicio cheie.
      - name: Generate public/sitemap-locatii.xml
        env:
          BASE44_APP_ID: 6a48cb9d04fa7f999d8a8054
        run: node scripts/generate-sitemap-locations.mjs

      - name: Commit if changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- public/sitemap-locatii.xml)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sitemap-locatii.xml
          git commit -m "Regenerate location sitemap"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Un push facut cu GITHUB_TOKEN nu porneste alte workflow-uri, deci workflow-ul
      # IndexNow nu s-ar declansa singur. Trimiterea se face direct de aici.
      - name: Submit to IndexNow
        if: steps.commit.outputs.changed == 'true'
        run: node scripts/indexnow-submit.mjs

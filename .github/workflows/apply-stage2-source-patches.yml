name: Apply Stage 2 Source Patches

on:
  push:
    branches:
      - chatgpt/services-prerequisites-stage-2
    paths:
      - "scripts/apply-stage2-source-patches.mjs"
      - ".github/workflows/apply-stage2-source-patches.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/services-prerequisites-stage-2
          fetch-depth: 0
      - name: Apply verified replacements
        run: node scripts/apply-stage2-source-patches.mjs
      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/workspace/provider/ProviderServices.jsx base44/functions/profileFoundationOps/entry.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Expose service prerequisites and equipment keys"
          git push origin HEAD:chatgpt/services-prerequisites-stage-2

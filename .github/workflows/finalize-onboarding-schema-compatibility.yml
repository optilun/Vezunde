name: Finalize onboarding schema compatibility

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-onboarding-schema-compatibility.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply compatibility changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          submit_path = Path('base44/functions/submitProviderClaim/entry.ts')
          submit = submit_path.read_text()
          submit = submit.replace("            requested_membership_role: requestedMembershipRole,\n", "")
          submit = submit.replace("      requested_membership_role: requestedMembershipRole,\n", "")
          submit_path.write_text(submit)

          admin_path = Path('base44/functions/adminProviderClaimReview/entry.ts')
          admin = admin_path.read_text()
          old = """    await svc.entities.ProviderClaimRequest.update(claim.id, {
      status: 'aprobata',
      requested_membership_role: requestedRole,
      approved_membership_role: approvedRole,
      reviewed_at: new Date().toISOString(),
      review_notes: note,
    });"""
          new = """    const reviewedPayload = JSON.stringify({
      ...submitted,
      requested_membership_role: requestedRole,
      approved_membership_role: approvedRole,
    });
    await svc.entities.ProviderClaimRequest.update(claim.id, {
      status: 'aprobata',
      submitted_payload: reviewedPayload,
      reviewed_at: new Date().toISOString(),
      review_notes: note,
    });"""
          if old not in admin:
              raise SystemExit('admin approval block not found')
          admin_path.write_text(admin.replace(old, new))

          claims_path = Path('src/components/admin/directory/DirOpsClaims.jsx')
          claims = claims_path.read_text()
          claims = claims.replace(
              "            const requestedRole = requestedRoleForClaim(claim);\n",
              "            const payload = parsePayload(claim.submitted_payload);\n            const requestedRole = requestedRoleForClaim(claim);\n            const approvedRole = payload.approved_membership_role || \"\";\n",
          )
          claims = claims.replace(
              "                    {claim.approved_membership_role && (\n                      <div className=\"text-xs text-muted-foreground mt-1\">Acces aprobat: {ROLE_LABELS[claim.approved_membership_role] || claim.approved_membership_role}</div>\n                    )}",
              "                    {approvedRole && (\n                      <div className=\"text-xs text-muted-foreground mt-1\">Acces aprobat: {ROLE_LABELS[approvedRole] || approvedRole}</div>\n                    )}",
          )
          claims_path.write_text(claims)

          test_path = Path('scripts/verify-provider-onboarding-continuity.mjs')
          test = test_path.read_text()
          test = test.replace(
              "expect('base44/functions/submitProviderClaim/entry.ts', 'requested_membership_role: requestedMembershipRole', 'Cererea salveaza rolul solicitat');",
              "expect('base44/functions/submitProviderClaim/entry.ts', 'requested_membership_role: requestedMembershipRole', 'Cererea salveaza rolul solicitat in submitted_payload');",
          )
          test = test.replace(
              "expect('base44/functions/adminProviderClaimReview/entry.ts', \"approved_membership_role: approvedRole\", 'Adminul salveaza rolul aprobat');",
              "expect('base44/functions/adminProviderClaimReview/entry.ts', \"approved_membership_role: approvedRole\", 'Adminul salveaza rolul aprobat in submitted_payload');",
          )
          test_path.write_text(test)

          Path('.github/workflows/finalize-onboarding-schema-compatibility.yml').unlink()
          PY
      - name: Verify onboarding
        run: |
          npm ci --silent
          node scripts/verify-provider-onboarding-continuity.mjs
          npm run lint
          npm run build
          npm run test:provider-submissions
      - name: Commit final onboarding compatibility
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize provider onboarding for live Base44 schema"
          git push origin HEAD:main

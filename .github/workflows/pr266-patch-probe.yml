name: PR266 Patch Probe

on:
  pull_request:
    paths:
      - scripts/apply-pr266-post-evaluation-patch.mjs
      - .github/workflows/pr266-patch-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/patient-conversation-agent-contract
          fetch-depth: 1

      - name: Run patch applicator probe
        shell: cmd
        run: node scripts/apply-pr266-post-evaluation-patch.mjs

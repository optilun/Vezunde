name: Apply onboarding schema compatibility

on:
  push:
    branches:
      - fix/onboarding-schema-compatibility-20260713
    paths:
      - ".github/workflows/apply-onboarding-schema-compatibility.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/onboarding-schema-compatibility-20260713
          fetch-depth: 0
      - name: Make onboarding compatible with live Base44 schema
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          submit_path = Path('base44/functions/submitProviderClaim/entry.ts')
          submit = submit_path.read_text()
          submit = submit.replace("            requested_membership_role: requestedMembershipRole,\n", "")
          submit = submit.replace("      requested_membership_role: requestedMembershipRole,\n", "")
          submit_path.write_text(submit)

          admin_path = Path('base44/functions/adminProviderClaimReview/entry.ts')
          admin = admin_path.read_text()
          old = """    await svc.entities.ProviderClaimRequest.update(claim.id, {
      status: 'aprobata',
      requested_membership_role: requestedRole,
      approved_membership_role: approvedRole,
      reviewed_at: new Date().toISOString(),
      review_notes: note,
    });"""
          new = """    const reviewedPayload = JSON.stringify({
      ...submitted,
      requested_membership_role: requestedRole,
      approved_membership_role: approvedRole,
    });
    await svc.entities.ProviderClaimRequest.update(claim.id, {
      status: 'aprobata',
      submitted_payload: reviewedPayload,
      reviewed_at: new Date().toISOString(),
      review_notes: note,
    });"""
          if old not in admin:
              raise SystemExit('admin approval block not found')
          admin = admin.replace(old, new)
          admin_path.write_text(admin)

          claims_path = Path('src/components/admin/directory/DirOpsClaims.jsx')
          claims = claims_path.read_text()
          claims = claims.replace(
              "            const requestedRole = requestedRoleForClaim(claim);\n",
              "            const requestedRole = requestedRoleForClaim(claim);\n            const approvedRole = parsePayload(claim.submitted_payload).approved_membership_role || \"\";\n",
          )
          claims = claims.replace(
              "                    {claim.approved_membership_role && (\n                      <div className=\"text-xs text-muted-foreground mt-1\">Acces aprobat: {ROLE_LABELS[claim.approved_membership_role] || claim.approved_membership_role}</div>\n                    )}",
              "                    {approvedRole && (\n                      <div className=\"text-xs text-muted-foreground mt-1\">Acces aprobat: {ROLE_LABELS[approvedRole] || approvedRole}</div>\n                    )}",
          )
          claims_path.write_text(claims)

          test_path = Path('scripts/verify-provider-onboarding-continuity.mjs')
          test = test_path.read_text()
          test = test.replace(
              "expect('base44/functions/submitProviderClaim/entry.ts', 'requested_membership_role: requestedMembershipRole', 'Cererea salveaza rolul solicitat');",
              "expect('base44/functions/submitProviderClaim/entry.ts', 'requested_membership_role: requestedMembershipRole', 'Cererea salveaza rolul solicitat in submitted_payload');\nreject('base44/functions/submitProviderClaim/entry.ts', /ProviderClaimRequest\\.create\\([\\s\\S]*requested_membership_role:/, 'Crearea cererii nu depinde de un camp de schema nou');",
          )
          test = test.replace(
              "expect('base44/functions/adminProviderClaimReview/entry.ts', \"approved_membership_role: approvedRole\", 'Adminul salveaza rolul aprobat');",
              "expect('base44/functions/adminProviderClaimReview/entry.ts', \"approved_membership_role: approvedRole\", 'Adminul salveaza rolul aprobat in submitted_payload');\nreject('base44/functions/adminProviderClaimReview/entry.ts', /ProviderClaimRequest\\.update\\(claim\\.id,[\\s\\S]*approved_membership_role:/, 'Aprobarea nu depinde de un camp de schema nou');",
          )
          test_path.write_text(test)

          workflow = Path('.github/workflows/apply-onboarding-schema-compatibility.yml')
          workflow.unlink()
          PY
      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make provider onboarding compatible with live Base44 schema"
          git push origin HEAD:fix/onboarding-schema-compatibility-20260713

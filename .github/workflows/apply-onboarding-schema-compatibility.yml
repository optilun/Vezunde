name: Apply onboarding schema compatibility

on:
  push:
    branches:
      - fix/onboarding-schema-compatibility-20260713
    paths:
      - ".github/workflows/apply-onboarding-schema-compatibility.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/onboarding-schema-compatibility-20260713
          fetch-depth: 0
      - name: Patch schema-incompatible writes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          submit_path = Path('base44/functions/submitProviderClaim/entry.ts')
          submit = submit_path.read_text()
          submit = submit.replace("            requested_membership_role: requestedMembershipRole,\n", "")
          submit = submit.replace("      requested_membership_role: requestedMembershipRole,\n", "")
          submit_path.write_text(submit)

          claims_path = Path('src/components/admin/directory/DirOpsClaims.jsx')
          claims = claims_path.read_text()
          if 'const approvedRole = parsePayload(claim.submitted_payload).approved_membership_role || "";' not in claims:
              claims = claims.replace(
                  "            const requestedRole = requestedRoleForClaim(claim);\n",
                  "            const requestedRole = requestedRoleForClaim(claim);\n            const approvedRole = parsePayload(claim.submitted_payload).approved_membership_role || \"\";\n",
              )
          claims = claims.replace(
              "                    {claim.approved_membership_role && (\n                      <div className=\"text-xs text-muted-foreground mt-1\">Acces aprobat: {ROLE_LABELS[claim.approved_membership_role] || claim.approved_membership_role}</div>\n                    )}",
              "                    {approvedRole && (\n                      <div className=\"text-xs text-muted-foreground mt-1\">Acces aprobat: {ROLE_LABELS[approvedRole] || approvedRole}</div>\n                    )}",
          )
          claims_path.write_text(claims)

          workflow = Path('.github/workflows/apply-onboarding-schema-compatibility.yml')
          workflow.unlink()
          patch_script = Path('scripts/apply-onboarding-schema-compatibility.mjs')
          if patch_script.exists(): patch_script.unlink()
          PY
      - name: Verify compatibility
        run: node scripts/verify-onboarding-schema-compatibility.mjs
      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make provider onboarding compatible with live Base44 schema"
          git push origin HEAD:fix/onboarding-schema-compatibility-20260713

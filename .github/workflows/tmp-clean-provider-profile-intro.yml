name: Temporary clean provider profile intro

on:
  push:
    branches:
      - ui/clean-provider-profile-intro

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove redundant profile intro
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/workspace/provider/ProviderProfilePublic.jsx')
          text = path.read_text(encoding='utf-8')
          old = '''      <header>
        <div className="inline-flex items-center gap-2 text-sm font-semibold text-[#345bc8]">
          <span className="h-2 w-2 bg-[#345bc8]" />
          Identitate publica · organizatie
        </div>
        <h1 className="mt-3 max-w-3xl font-heading text-[2.05rem] font-extrabold leading-[1.05] tracking-[-0.04em] text-[#171717] sm:text-[2.45rem]">
          Profilul organizatiei tale.
        </h1>
        <p className="mt-2.5 max-w-3xl text-base leading-[1.65] text-[#615e57]">
          Vezi profilul asa cum este prezentat public si editeaza informatiile
          direct in acelasi loc.
        </p>
      </header>

'''
          if old not in text:
              raise SystemExit('Expected provider profile intro block was not found.')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
      - name: Commit final patch
        run: |
          rm .github/workflows/tmp-clean-provider-profile-intro.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/workspace/provider/ProviderProfilePublic.jsx .github/workflows/tmp-clean-provider-profile-intro.yml
          git commit -m "Remove provider profile intro"
          git push

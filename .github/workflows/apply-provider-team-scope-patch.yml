name: Apply provider team scope patch

on:
  push:
    branches:
      - fix/provider-team-org-scope

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/provider-team-org-scope
          fetch-depth: 0

      - name: Apply scoped team assignment patch
        run: python scripts/apply-provider-team-scope-patch.py

      - name: Remove temporary patch files
        run: |
          rm scripts/apply-provider-team-scope-patch.py
          rm .github/workflows/apply-provider-team-scope-patch.yml

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add base44/functions/submitProviderWorkspaceChange/entry.ts shared/providerTeamLocationScope.js scripts/verify-provider-submission-backend.mjs scripts/apply-provider-team-scope-patch.py .github/workflows/apply-provider-team-scope-patch.yml
          git commit -m "Scope provider team assignments to organization"
          git push origin HEAD:fix/provider-team-org-scope

name: Provider onboarding CI

on:
  pull_request:
    paths:
      - "src/components/provider/**"
      - "src/components/account/ClaimStatusRow.jsx"
      - "src/components/specialists/**"
      - "src/components/workspace/applicant/**"
      - "src/components/workspace/provider/**"
      - "src/components/admin/directory/**"
      - "src/pages/AdminDirectoryOps.jsx"
      - "src/lib/adminNavConfig.js"
      - "src/lib/providerClaimScope.js"
      - "src/pages/AddOrClaim.jsx"
      - "src/pages/Login.jsx"
      - "src/pages/Register.jsx"
      - "src/pages/ForgotPassword.jsx"
      - "src/pages/ResetPassword.jsx"
      - "src/pages/MyAccount.jsx"
      - "src/pages/AcceptProfessionalInvitation.jsx"
      - "scripts/verify-account-workspace-loading.mjs"
      - "src/lib/postLoginRedirect.js"
      - "src/lib/workspaceNav.js"
      - "src/lib/providerWorkspaceAccess.js"
      - "src/lib/providerContextSearch.js"
      - "shared/providerOpeningHours.js"
      - "shared/providerLocationIdentityResolution.js"
      - "shared/providerAccountWorkflowContract.js"
      - "shared/providerClaimScopePolicy.js"
      - "shared/providerOrganizationOwnerScope.js"
      - "shared/professionalLifecycleLock.js"
      - "base44/entities/ProviderMemberInvitation.jsonc"
      - "base44/entities/ProviderMembership.jsonc"
      - "base44/entities/ProviderClaimScopeSelection.jsonc"
      - "base44/entities/ProviderClaimLocationSelection.jsonc"
      - "base44/entities/ProfessionalInvitation.jsonc"
      - "base44/entities/DirectoryCorrectionRequest.jsonc"
      - "base44/entities/User.jsonc"
      - "base44/entities/ProviderOrganization.jsonc"
      - "base44/functions/submitProviderClaim/**"
      - "base44/functions/getProviderClaimScopeOptions/**"
      - "base44/functions/submitProviderScopedClaim/**"
      - "base44/functions/adminProviderScopedClaimReview/**"
      - "base44/functions/syncProviderOrganizationOwnerAccess/**"
      - "base44/functions/getClaimableProviderLocations/**"
      - "base44/functions/getMyProviderOnboardingWorkspace/**"
      - "base44/functions/adminProviderClaimReview/**"
      - "base44/functions/saveProviderRoutineProfile/**"
      - "base44/functions/providerLocationIdentityResolutionOps/**"
      - "base44/functions/createProviderMemberInvitation/**"
      - "base44/functions/professionalInvitationOps/**"
      - "base44/functions/manageMyProfessionalProfile/**"
      - "base44/functions/getMyProviderMembers/**"
      - "base44/functions/submitProviderLogoForReview/**"
      - "base44/functions/getProviderLogoReviewStatus/**"
      - "base44/functions/reviewProfileChanges/**"
      - "base44/functions/submitDirectoryCorrection/**"
      - "base44/functions/adminDirectoryCorrectionReview/**"
      - "scripts/verify-provider-onboarding-continuity.mjs"
      - "scripts/verify-provider-claim-scope.mjs"
      - "scripts/verify-provider-opening-hours.mjs"
      - "scripts/verify-provider-location-identity-resolution.mjs"
      - "scripts/verify-provider-invitation-delivery.mjs"
      - "scripts/verify-professional-invitation-delivery.mjs"
      - "scripts/verify-professional-invitation-acceptance.mjs"
      - "scripts/verify-professional-lifecycle-concurrency.mjs"
      - "scripts/verify-professional-identity-ownership.mjs"
      - "scripts/verify-directory-correction-workflow.mjs"
      - "scripts/verify-provider-logo-review-status.mjs"
      - "scripts/verify-provider-account-workflow-e2e.mjs"
      - "scripts/verify-provider-location-access-scope.mjs"
      - "scripts/verify-provider-context-url.mjs"
      - "scripts/verify-dead-code-cleanup.mjs"
      - "scripts/audit-frontend-dead-code.mjs"
      - "scripts/compare-typecheck-baseline.mjs"
      - "package.json"
      - ".github/workflows/provider-onboarding-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --silent
      - name: Onboarding regression checks
        run: node scripts/verify-provider-onboarding-continuity.mjs
      - name: Scoped provider claim checks
        run: npm run test:provider-claim-scope
      - name: Directory correction workflow checks
        run: node scripts/verify-directory-correction-workflow.mjs
      - name: Provider hours regression checks
        run: npm run test:provider-hours
      - name: Provider location identity checks
        run: npm run test:provider-location-identity
      - name: Provider invitation delivery checks
        run: npm run test:provider-invitation-delivery
      - name: Professional invitation delivery checks
        run: node scripts/verify-professional-invitation-delivery.mjs
      - name: Professional invitation acceptance checks
        run: node scripts/verify-professional-invitation-acceptance.mjs
      - name: Professional lifecycle concurrency checks
        run: node scripts/verify-professional-lifecycle-concurrency.mjs
      - name: Professional identity ownership checks
        run: node scripts/verify-professional-identity-ownership.mjs
      - name: Provider logo review checks
        run: npm run test:provider-logo-review
      - name: Provider account workflow contract E2E
        run: npm run test:provider-account-e2e
      - name: Account workspace loading checks
        run: npm run test:account-loading
      - name: Provider location access scope checks
        run: npm run test:provider-location-access
      - name: Provider context URL checks
        run: npm run test:provider-context-url
      - name: Dead code cleanup regression checks
        run: node scripts/verify-dead-code-cleanup.mjs
      - name: Frontend dead code audit report
        run: node scripts/audit-frontend-dead-code.mjs | tee dead-code-audit.log
      - name: Typecheck current branch
        shell: bash
        run: |
          set +e
          npm run typecheck -- --pretty false > typecheck-head.log 2>&1
          grep -E "error TS|Found [0-9]+ errors" typecheck-head.log || true
          exit 0
      - name: Typecheck main baseline
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          git fetch origin "$BASE_SHA" --depth=1
          rm -rf /tmp/vezunde-typecheck-base
          git worktree add --detach /tmp/vezunde-typecheck-base "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/vezunde-typecheck-base/node_modules
          cd /tmp/vezunde-typecheck-base
          ./node_modules/.bin/tsc -p ./jsconfig.json --pretty false > "$GITHUB_WORKSPACE/typecheck-base.log" 2>&1
          exit 0
      - name: Reject new TypeScript errors
        run: node scripts/compare-typecheck-baseline.mjs typecheck-base.log typecheck-head.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-onboarding-diagnostics
          path: |
            typecheck-head.log
            typecheck-base.log
            dead-code-audit.log
      - name: Lint
        if: always()
        run: npm run lint
      - name: Build
        if: always()
        run: npm run build
      - name: Existing provider submission tests
        if: always()
        run: npm run test:provider-submissions

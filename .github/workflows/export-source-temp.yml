name: Apply provider status center patch

on:
  pull_request:
    paths:
      - ".github/workflows/export-source-temp.yml"
      - ".github/patches/status-center.patch.b64"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply staged implementation
        shell: bash
        run: |
          PATCH_FILE=".github/patches/status-center.patch.b64"
          if [ ! -f "$PATCH_FILE" ]; then
            echo "Patch not staged yet."
            exit 0
          fi
          base64 --decode "$PATCH_FILE" > /tmp/status-center.patch
          git apply --check /tmp/status-center.patch
          git apply /tmp/status-center.patch
          rm -f "$PATCH_FILE" .github/workflows/export-source-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add provider status center and canonical completeness"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

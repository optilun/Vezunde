name: Apply provider status center patch

on:
  pull_request:
    paths:
      - ".github/workflows/export-source-temp.yml"
      - ".github/patches/status-center.patch.b64.part-*"
      - ".github/patches/status-center.patch.ready"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply staged implementation
        shell: bash
        run: |
          READY_FILE=".github/patches/status-center.patch.ready"
          if [ ! -f "$READY_FILE" ]; then
            echo "Patch chunks are still being staged."
            exit 0
          fi
          shopt -s nullglob
          PARTS=(.github/patches/status-center.patch.b64.part-*)
          if [ "${#PARTS[@]}" -eq 0 ]; then
            echo "No patch chunks found."
            exit 1
          fi
          cat "${PARTS[@]}" > /tmp/status-center.patch.b64
          base64 --decode /tmp/status-center.patch.b64 > /tmp/status-center.patch
          git apply --check /tmp/status-center.patch
          git apply /tmp/status-center.patch
          rm -f "${PARTS[@]}" "$READY_FILE" .github/workflows/export-source-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add provider status center and canonical completeness"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
